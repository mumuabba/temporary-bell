<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="템퍼러리 호출벨">
<link rel="apple-touch-icon" href="icon-180.png">
<title>템퍼러리 호출벨</title>
<style>
  :root{
    --bg:#0F0F0F;
    --panel:#1B1B1B;
    --panel-deep:#151515;
    --line:#333333;
    --cream:#F5F5F3;
    --muted:#8F8F8B;
    --good:#5FBF7F;
  }
  *{
    margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    -webkit-touch-callout:none;
  }
  html,body{ height:100%; overscroll-behavior:none; background:#0F0F0F; }
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, 'Pretendard Variable', Pretendard, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    color-scheme:dark;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:9px; min-width:0; }
  .brand h1{ font-size:15px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap; }
  .logo-mark{ width:30px; height:30px; display:block; flex-shrink:0; }
  #btn-settings{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 12px; font-size:13px; font-family:inherit; white-space:nowrap;
  }
  .board{ flex-shrink:0; text-align:center; padding:14px 16px 10px; }
  .eyebrow{ font-size:11px; letter-spacing:0.3em; color:var(--muted); text-transform:uppercase; }
  #num{
    font-size:76px;
    font-size:clamp(64px, 22vw, 108px);
    font-weight:900; font-style:italic;
    font-family:'Arial Narrow', Arial, sans-serif;
    font-variant-numeric:tabular-nums;
    line-height:1.05; min-height:1.05em;
  }
  #num.empty{ color:#3A3A3A; }
  .board.speaking #num{ animation:pulse 1.1s ease-in-out infinite; text-shadow:0 0 30px rgba(255,255,255,0.3); }
  @keyframes pulse{ 50%{ opacity:0.7; } }
  @media (prefers-reduced-motion: reduce){ .board.speaking #num{ animation:none; } }
  #status{ font-size:12px; color:var(--muted); min-height:17px; }
  .board.speaking #status{ color:var(--cream); }
  #recent{ display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; flex-shrink:0; scrollbar-width:none; }
  #recent::-webkit-scrollbar{ display:none; }
  #recent .chip{
    flex-shrink:0; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:8px 8px 8px 15px;
    display:flex; align-items:center; gap:7px;
    font-family:inherit; color:var(--cream);
    font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;
  }
  #recent .chip .x{ width:22px; height:22px; border-radius:50%; background:#2C2C2C; color:var(--muted); font-size:12px; line-height:22px; text-align:center; }
  #recent .empty{ color:#555; font-size:13px; padding:9px 2px; }
  .pad{ flex:1; display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:1fr; gap:9px; padding:0 12px 12px; min-height:0; }
  .pad button{
    font-family:inherit; font-size:30px; font-weight:700; font-variant-numeric:tabular-nums;
    background:var(--panel); color:var(--cream); border:1px solid var(--line); border-radius:14px;
  }
  .pad button:active{ background:#2A2A2A; transform:scale(0.97); }
  .pad .clear{ font-size:15px; color:var(--muted); }
  .pad .call{ background:var(--cream); border-color:var(--cream); color:#000; font-size:19px; font-weight:800; }
  .pad .call:active{ background:#C9C9C9; }
  .pad button:disabled{ opacity:0.4; }
  #sheet{ position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(0,0,0,0.72); display:none; align-items:flex-end; z-index:10; }
  #sheet.open{ display:flex; }
  .sheet-inner{
    width:100%; background:var(--panel-deep);
    border-top-left-radius:18px; border-top-right-radius:18px;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .sheet-inner h2{ font-size:16px; margin-bottom:16px; }
  .row{ margin-bottom:17px; }
  .row label{ display:block; font-size:12px; color:var(--muted); margin-bottom:7px; }
  .row select, .row input[type="text"]{
    width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--cream); border-radius:9px; padding:11px 10px;
    font-size:16px; font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .range-row{ display:flex; align-items:center; gap:12px; }
  .range-row input[type=range]{ flex:1; accent-color:var(--cream); height:28px; }
  .range-row output{ font-size:13px; min-width:46px; text-align:right; font-variant-numeric:tabular-nums; }
  .check{ display:flex; align-items:center; gap:10px; margin-bottom:15px; }
  .check input{ width:21px; height:21px; accent-color:var(--cream); flex-shrink:0; }
  .check label{ font-size:15px; margin:0; color:var(--cream); }
  .btn-row{ display:flex; gap:9px; }
  #btn-test{ flex:1; background:none; border:1px solid var(--cream); color:var(--cream); border-radius:11px; padding:14px; font-size:15px; font-weight:600; font-family:inherit; }
  #btn-close{ flex:1; background:var(--cream); border:none; color:#000; border-radius:11px; padding:14px; font-size:15px; font-weight:700; font-family:inherit; }
  .note{ font-size:12px; color:var(--muted); line-height:1.65; border-top:1px solid var(--line); padding-top:13px; margin-top:17px; }
  .note b{ color:var(--cream); }
  #voice-row{ display:none; }
  #voice-row.show{ display:block; }
  #oops{ display:none; background:#3A1A1A; border-bottom:1px solid #6B2E2E; color:#F0C0C0; font-size:13px; line-height:1.6; padding:12px 16px; }
  #oops.show{ display:block; }
  #tip{ display:none; background:#3A2A16; border-bottom:1px solid #6B4E22; color:#F0D9A8; font-size:12.5px; line-height:1.55; padding:9px 16px; align-items:center; gap:12px; }
  #tip.show{ display:flex; }
  #tip b{ color:#FFD98A; }
  #tip button{ margin-left:auto; flex-shrink:0; background:#F0D9A8; border:none; color:#2A1F0C; border-radius:7px; padding:6px 12px; font-size:12px; font-weight:700; font-family:inherit; }
</style>
</head>
<body>

<div id="oops"></div>

<script>
/* 오래된 기기에서 화면만 뜨고 반응이 없는 상황을 알려준다. 일부러 옛날 문법으로만 썼다. */
(function () {
  var box = document.getElementById('oops');
  function show(msg){ box.textContent = msg; box.className = 'show'; }
  window.__bellReady = function () { clearTimeout(window.__bellTimer); };
  window.__bellTimer = setTimeout(function () {
    show('이 기기에서 호출벨이 실행되지 못했습니다. 이 문장이 보이면 캡처해서 알려 주세요.');
  }, 2500);
  window.onerror = function (m, s, line) {
    clearTimeout(window.__bellTimer);
    show('오류: ' + m + ' (줄 ' + line + ') — 이 문장을 그대로 캡처해서 보내 주세요.');
    return false;
  };
})();
</script>

<header>
  <div class="brand">
    <svg class="logo-mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="55" fill="#000" stroke="#3A3A3A" stroke-width="1"/>
      <text x="60" y="61" text-anchor="middle" dominant-baseline="central"
            font-family="Arial Narrow, Arial, sans-serif" font-style="italic"
            font-weight="900" font-size="30" fill="#fff"
            textLength="116" lengthAdjust="spacingAndGlyphs">TEMPORARY</text>
    </svg>
    <h1>템퍼러리 호출벨</h1>
  </div>
  <button id="btn-settings">설정</button>
</header>

<div id="tip">
  <span>소리가 안 나면 <b>옆면 무음 스위치</b>를 풀고 볼륨을 올려 주세요.</span>
  <button id="tip-ok">확인</button>
</div>

<div class="board" id="board">
  <div class="eyebrow">NOW SERVING</div>
  <div id="num" class="empty">0</div>
  <div id="status">번호를 누르고 호출</div>
</div>

<div id="recent"><span class="empty">최근 호출이 여기 표시됩니다</span></div>

<div class="pad" id="pad">
  <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
  <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
  <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
  <button class="clear" data-act="clear">지우기</button>
  <button data-d="0">0</button>
  <button class="call" data-act="call">호출</button>
</div>

<div id="sheet">
  <div class="sheet-inner">
    <h2>설정</h2>
    <div class="row">
      <label for="preset">호출 문구</label>
      <select id="preset"></select>
    </div>
    <div class="row" id="custom-row" style="display:none">
      <label for="tpl">직접 입력 — 번호는 문장 앞에 붙습니다</label>
      <input type="text" id="tpl" autocomplete="off" autocapitalize="off">
    </div>
    <div class="row" id="voice-row">
      <label for="voice">직접 입력할 때 쓸 목소리</label>
      <select id="voice"></select>
    </div>
    <div class="row">
      <label for="rate">말 속도</label>
      <div class="range-row">
        <input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1">
        <output id="rate-out">1x</output>
      </div>
    </div>
    <div class="row">
      <label for="vol">볼륨</label>
      <div class="range-row">
        <input type="range" id="vol" min="0.1" max="1" step="0.05" value="1">
        <output id="vol-out">100%</output>
      </div>
    </div>
    <div class="check">
      <input type="checkbox" id="chime" checked>
      <label for="chime">호출 전 차임벨</label>
    </div>
    <div class="check">
      <input type="checkbox" id="twice">
      <label for="twice">두 번 반복</label>
    </div>
    <div class="check">
      <input type="checkbox" id="use-clip">
      <label for="use-clip">선히 목소리로 (블루투스 스피커를 쓸 때 이걸 켜세요)</label>
    </div>
    <div class="btn-row">
      <button id="btn-test">미리 듣기</button>
      <button id="btn-close">닫기</button>
    </div>
    <div class="note">
      <b>홈 화면에 추가</b> — 사파리 아래 공유 버튼 → "홈 화면에 추가"를 하면 앱처럼 전체화면으로 열립니다.
    </div>
  </div>
</div>

<script>
'use strict';

/* mp3 녹음이 있는 문구들 (선히 목소리). 파일: voice/키/번호.mp3 */
var PRESETS = [
  { tpl:'손님, 음료가 준비 되었습니다.', key:'8b2a78b0' },
  { tpl:'{번호}번 고객님, 음료 나왔습니다.', key:'17c40433' },
  { tpl:'손님, 음료가 준비 되었습니다. 카운터로 오세요', key:'5bfd6150' },
  { tpl:'손님, 음료가 준비 되었습니다. 카운터로 와주세요', key:'0541cc5a' },
  { tpl:'{번호}번 고객님, 주문하신 음료가 준비되었습니다.', key:'a5e1107c' },
  { tpl:'손님, 음료가 준비 되었습니다. 카운터로 와주시면 감사하겠습니다.', key:'f5ff1e32' },
  { tpl:'손님, 음료가 준비 되었습니다. 카운터로 오셔서 음료를 받아가세요.', key:'c102caeb' }
];
var CLIP_MAX = 200;

var el = function (id){ return document.getElementById(id); };
var $num = el('num'), $status = el('status'), $board = el('board'),
    $recent = el('recent'), $pad = el('pad'), $sheet = el('sheet'),
    $preset = el('preset'), $tpl = el('tpl'), $customRow = el('custom-row'),
    $voice = el('voice'), $voiceRow = el('voice-row'),
    $rate = el('rate'), $rateOut = el('rate-out'),
    $vol = el('vol'), $volOut = el('vol-out'),
    $chime = el('chime'), $twice = el('twice'), $useClip = el('use-clip'), $tip = el('tip');

/* ── 문구 목록 채우기 ─────────────────── */
function labelOf(tpl){ return tpl.indexOf('{번호}') > -1 ? tpl.split('{번호}').join('○') : '○번 ' + tpl; }
for (var i = 0; i < PRESETS.length; i++){
  var o = document.createElement('option');
  o.value = String(i); o.textContent = labelOf(PRESETS[i].tpl);
  $preset.appendChild(o);
}
var oCustom = document.createElement('option');
oCustom.value = 'custom'; oCustom.textContent = '직접 입력 (아이폰 목소리)';
$preset.appendChild(oCustom);

/* ── 설정 저장 ─────────────────────── */
var store = {
  load: function (){ try{ return JSON.parse(localStorage.getItem('tempBell') || '{}'); }catch(e){ return {}; } },
  save: function (s){ try{ localStorage.setItem('tempBell', JSON.stringify(s)); }catch(e){} }
};
var saved = store.load();
$preset.value = (saved.sel != null && (saved.sel === 'custom' || +saved.sel < PRESETS.length)) ? saved.sel : '0';
$tpl.value = saved.customTpl || '고객님, 음료 나왔습니다.';
if (saved.rate != null) $rate.value = saved.rate;
if (saved.vol != null) $vol.value = saved.vol;
if (saved.chime != null) $chime.checked = saved.chime;
if (saved.twice != null) $twice.checked = saved.twice;
if (saved.useClip != null) $useClip.checked = saved.useClip;
syncMode();
syncOut();

function persist(){
  store.save({
    sel: $preset.value, customTpl: $tpl.value,
    rate: $rate.value, vol: $vol.value,
    chime: $chime.checked, twice: $twice.checked, useClip: $useClip.checked, voice: $voice.value
  });
}
function syncOut(){
  $rateOut.textContent = (Math.round(Number($rate.value) * 100) / 100 + '').replace(/0$/, '') + 'x';
  $volOut.textContent = Math.round($vol.value * 100) + '%';
}
function isCustom(){ return $preset.value === 'custom'; }
function usingTTS(){ return isCustom() || !$useClip.checked; }
function syncMode(){
  $customRow.style.display = isCustom() ? 'block' : 'none';
  $voiceRow.className = usingTTS() ? 'show' : '';   // 아이폰 목소리를 쓸 때만 목소리 선택 노출
}
$preset.addEventListener('change', function (){ syncMode(); persist(); });
$tpl.addEventListener('input', persist);
$rate.addEventListener('input', function (){ syncOut(); persist(); });
$vol.addEventListener('input', function (){ syncOut(); persist(); });
$chime.addEventListener('change', persist);
$twice.addEventListener('change', persist);
$useClip.addEventListener('change', function (){ syncMode(); persist(); });
$voice.addEventListener('change', persist);

/* ── 아이폰 기본 목소리 (직접 입력용) ── */
var voices = [];
function loadVoices(){
  var all = speechSynthesis.getVoices();
  voices = [];
  for (var i = 0; i < all.length; i++){ if (/^ko/i.test(all[i].lang)) voices.push(all[i]); }
  if (!voices.length) return;
  voices.sort(function (a, b){
    var sa = /premium|enhanced|고급|프리미엄/i.test(a.name) ? 0 : 1;
    var sb = /premium|enhanced|고급|프리미엄/i.test(b.name) ? 0 : 1;
    return sa - sb;
  });
  $voice.innerHTML = '';
  for (var j = 0; j < voices.length; j++){
    var op = document.createElement('option');
    op.value = voices[j].name; op.textContent = voices[j].name;
    $voice.appendChild(op);
  }
  if (saved.voice){
    for (var k = 0; k < voices.length; k++){ if (voices[k].name === saved.voice) $voice.value = saved.voice; }
  }
}
loadVoices();
if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', loadVoices);

/* ── 숫자 → 한자어 (7 → 칠) ── */
function sino(n){
  var d = ['','일','이','삼','사','오','육','칠','팔','구'], u = ['','십','백','천'];
  var s = String(+n); if (s === '0') return '영';
  var out = '';
  for (var i = 0; i < s.length; i++){
    var dg = +s[i], pos = s.length - 1 - i;
    if (!dg) continue;
    out += (dg === 1 && pos > 0 ? '' : d[dg]) + u[pos];
  }
  return out;
}
function customSentence(n){
  var t = $tpl.value.replace(/^\s+|\s+$/g, '') || '고객님, 음료 나왔습니다.';
  var spoken = sino(n);
  return t.indexOf('{번호}') > -1 ? t.split('{번호}').join(spoken) : spoken + '번 ' + t;
}

/* ── 소리 열기 (아이폰은 첫 터치에서 열어야 한다) ── */
var ctx = null, unlocked = false;
function unlock(){
  try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); }catch(e){}
  if (unlocked) return;
  unlocked = true;
  try{ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener('touchstart', unlock, true);
document.addEventListener('mousedown', unlock, true);

function chime(v){
  return new Promise(function (res){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      var t0 = ctx.currentTime, pairs = [[1318.5, 0], [1046.5, 0.22]];
      for (var i = 0; i < pairs.length; i++){
        var f = pairs[i][0], dt = pairs[i][1];
        var o = ctx.createOscillator(), o2 = ctx.createOscillator();
        var g = ctx.createGain(), g2 = ctx.createGain();
        o.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = 0.18;
        o2.connect(g2); g2.connect(g); o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0, t0 + dt);
        g.gain.linearRampToValueAtTime(0.5 * v, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dt + 0.75);
        o.start(t0 + dt); o.stop(t0 + dt + 0.85);
        o2.start(t0 + dt); o2.stop(t0 + dt + 0.85);
      }
      setTimeout(res, 700);
    }catch(e){ res(); }
  });
}

/* 선히 녹음 재생 (Web Audio).
   이 방식은 틀어놓은 음악을 멈추지 않고 그 위에 얹어 낸다. (다만 아이폰이 웹 소리를 눌러 조금 작다)
   실패하면 아이폰 목소리로 넘겨 소리는 반드시 나게 한다. */
var bufCache = {};
function loadBuffer(url, ok, fail){
  if (bufCache[url]){ ok(bufCache[url]); return; }
  var settled = false;
  var okOnce = function (b){ if (!settled){ settled = true; ok(b); } };
  var failOnce = function (){ if (!settled){ settled = true; fail(); } };
  setTimeout(failOnce, 2500);   // 어떤 기기는 디코딩이 응답 없이 멈춘다 → 폴백
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.responseType = 'arraybuffer';
  xhr.onload = function (){
    if (xhr.status !== 200){ failOnce(); return; }
    try{
      var p = ctx.decodeAudioData(xhr.response,
        function (b){ bufCache[url] = b; okOnce(b); },
        function (){ failOnce(); });
      if (p && p.then) p.then(function (b){ bufCache[url] = b; okOnce(b); }, failOnce);
    }catch(e){ failOnce(); }
  };
  xhr.onerror = failOnce;
  try{ xhr.send(); }catch(e){ failOnce(); }
}
function ensureRunning(cb){
  try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ cb(); return; }
  if (ctx.state === 'running'){ cb(); return; }
  var called = false, go = function (){ if (!called){ called = true; cb(); } };
  try{ var p = ctx.resume(); if (p && p.then) p.then(go, go); }catch(e){}
  setTimeout(go, 350);
}
function playClipWA(key, n){
  return new Promise(function (resolve, reject){
    ensureRunning(function (){
      if (!ctx){ reject(new Error('no ctx')); return; }
      loadBuffer('voice/' + key + '/' + n + '.mp3', function (buf){
        try{
          var s = ctx.createBufferSource(), g = ctx.createGain(), comp = ctx.createDynamicsCompressor();
          s.buffer = buf;
          g.gain.value = Math.min(7, Number($vol.value) * 5);   // 음악과 섞이면 눌리므로 세게 키움
          try{ comp.threshold.value = -14; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.001; comp.release.value = 0.12; }catch(e){}
          try{ s.playbackRate.value = Number($rate.value); }catch(e){}
          s.connect(g); g.connect(comp); comp.connect(ctx.destination);
          var done = false, fin = function (){ if (!done){ done = true; resolve(); } };
          s.onended = fin;
          s.start(0);
          setTimeout(fin, (buf.duration / Math.max(0.5, Number($rate.value))) * 1000 + 900);
        }catch(e){ reject(e); }
      }, function (){ reject(new Error('decode fail')); });
    });
  });
}
function speak(text){
  return new Promise(function (res){
    var done = false, fin = function (){ if (!done){ done = true; res(); } };
    try{
      var u = new SpeechSynthesisUtterance(text);
      var v = null;
      for (var i = 0; i < voices.length; i++){ if (voices[i].name === $voice.value) v = voices[i]; }
      if (!v && voices.length) v = voices[0];
      if (v) u.voice = v;
      u.lang = 'ko-KR';
      u.rate = Number($rate.value);
      u.volume = Number($vol.value);
      u.onend = fin; u.onerror = fin;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(fin, 15000);
    }catch(e){ fin(); }
  });
}

/* 한 번 말하기.
   기본은 아이폰 목소리(TTS) — 아이폰이 음악을 자동으로 살짝 줄였다 되돌린다.
   단 아이폰은 블루투스 스피커가 연결돼 있어도 TTS만은 본체 스피커로 낸다(iOS 결함, 웹에서 못 고침).
   "선히 목소리"를 켜면 선히 녹음을 차임벨과 같은 경로(Web Audio)로 재생해 블루투스로 나가고,
   동시에 무음(볼륨 0) TTS를 함께 돌려 iOS의 음악 자동 줄임(duck)도 걸리게 시도한다. */
function silentDuck(text){
  try{
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = Number($rate.value);   // 길이를 선히 녹음과 비슷하게 맞춘다
    u.volume = 0;                   // 소리는 선히가 내고, 이건 음악 줄임 유발용
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function sayOnce(n){
  var preset = isCustom() ? null : PRESETS[+$preset.value];
  var text = preset ? customFromPreset(preset, n) : customSentence(n);
  if ($useClip && $useClip.checked && preset && +n >= 1 && +n <= CLIP_MAX){
    silentDuck(text);
    return playClipWA(preset.key, n).then(
      function (){ try{ speechSynthesis.cancel(); }catch(e){} },
      function (){ return speak(text); });
  }
  return speak(text);
}
function customFromPreset(preset, n){
  var t = preset ? preset.tpl : '고객님, 음료 나왔습니다.';
  var spoken = sino(n);
  return t.indexOf('{번호}') > -1 ? t.split('{번호}').join(spoken) : spoken + '번 ' + t;
}

/* ── 호출 ───────────────────────────── */
var buf = '', last = null, busy = false;
var recent = [];

function render(){ $num.textContent = buf || '0'; if (buf) $num.className = ''; else $num.className = 'empty'; }
function setBusy(v){
  var bs = $pad.querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) bs[i].disabled = v;
}

function call(n){
  if (busy) return;
  n = String(n).replace(/\D/g, '');
  if (!n || +n < 1) return;
  unlock();
  busy = true;
  last = n; buf = n; render();
  addRecent(n);
  $board.className = 'board speaking';
  $status.textContent = '호출 중';
  setBusy(true);

  var times = $twice.checked ? 2 : 1, i = 0;
  var step = function (){
    if (i >= times){ finish(); return; }
    i++;
    sayOnce(n).then(function (){
      if (i < times) setTimeout(step, 400); else finish();
    });
  };
  var finish = function (){
    $board.className = 'board';
    $status.textContent = n + '번 호출 완료 · ' + clock();
    buf = ''; render();
    setBusy(false);
    busy = false;
  };
  var go = function (){ step(); };
  if ($chime.checked) chime(Number($vol.value)).then(go); else go();
}
function clock(){ return new Date().toTimeString().slice(0, 5); }

function addRecent(n){
  for (var i = 0; i < recent.length; i++){ if (recent[i].n === n){ recent.splice(i, 1); break; } }
  recent.unshift({ n: n, t: clock() });
  if (recent.length > 12) recent.pop();
  drawRecent();
}
function drawRecent(){
  $recent.innerHTML = '';
  if (!recent.length){
    var s = document.createElement('span');
    s.className = 'empty'; s.textContent = '최근 호출이 여기 표시됩니다';
    $recent.appendChild(s); return;
  }
  for (var i = 0; i < recent.length; i++){
    (function (r){
      var b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = '<span>' + r.n + '</span><span class="x">✕</span>';
      b.addEventListener('click', function (e){
        if (e.target.className === 'x'){
          for (var j = 0; j < recent.length; j++){ if (recent[j].n === r.n){ recent.splice(j, 1); break; } }
          drawRecent();
        } else call(r.n);
      });
      $recent.appendChild(b);
    })(recent[i]);
  }
}

/* ── 키패드 탭 (아이폰 대응) ── */
function firePad(b){
  if (!b || b.disabled) return;
  var d = b.getAttribute('data-d'), act = b.getAttribute('data-act');
  if (d != null){ buf = (buf + d).slice(0, 3); render(); }
  else if (act === 'clear'){ if (buf){ buf = ''; render(); } else if (last) call(last); }
  else if (act === 'call'){ call(buf || last || ''); }
}
function padTarget(e){
  var t = e.target;
  while (t && t !== $pad){ if (t.tagName === 'BUTTON') return t; t = t.parentNode; }
  return null;
}
var justTouched = false;
$pad.addEventListener('touchend', function (e){
  var b = padTarget(e);
  if (!b) return;
  e.preventDefault();
  justTouched = true;
  setTimeout(function (){ justTouched = false; }, 500);
  firePad(b);
}, { passive: false });
$pad.addEventListener('click', function (e){
  if (justTouched) return;
  firePad(padTarget(e));
});

document.addEventListener('keydown', function (e){
  if ($sheet.className.indexOf('open') > -1) return;
  if (/^[0-9]$/.test(e.key)){ buf = (buf + e.key).slice(0, 3); render(); }
  else if (e.key === 'Enter'){ call(buf || last || ''); }
  else if (e.key === 'Backspace'){ buf = buf.slice(0, -1); render(); }
  else if (e.key === ' '){ e.preventDefault(); if (!buf && last) call(last); }
});

el('btn-settings').addEventListener('click', function (){ $sheet.className = 'open'; });
el('btn-close').addEventListener('click', function (){ $sheet.className = ''; });
$sheet.addEventListener('click', function (e){ if (e.target === $sheet) $sheet.className = ''; });
el('btn-test').addEventListener('click', function (){
  unlock();
  var run = function (){ sayOnce(7); };
  if ($chime.checked) chime(Number($vol.value)).then(run); else run();
});

if (!saved.tipSeen && /iPhone|iPad|iPod/.test(navigator.userAgent)) $tip.className = 'show';
el('tip-ok').addEventListener('click', function (){
  $tip.className = '';
  var s = store.load(); s.tipSeen = true; store.save(s);
});

render();
drawRecent();
if (window.__bellReady) window.__bellReady();
</script>
